(function(root){

 function prepare(level,{reflectMirrors=true}={}){
  if(!Array.isArray(level.rows)||!level.rows.length||typeof level.rows[0]!=='string'||!level.rows[0].length)throw new Error('关卡网格格式错误');
  const height=level.rows.length,width=level.rows[0].length;

  const cells=level.rows.join('').split(''),paths={},traces={},hitSets={},targets=[],candidates=[],blocked=[],forbidden=[],doubles=[],mirrors=[],noPlace=[];

   else if(x==='/'||x==='\\')mirrors.push(i);
   // C3 不可放置格：是目标、不是候选，透光（只有#阻挡）。
   else if(x==='N'){targets.push(i);noPlace.push(i);}

    while(true){
     const a=r+dr,b=c+dc;
     if(a<0||a>=height||b<0||b>=width){end={type:'boundary',index:r*width+c,direction:[dr,dc],row:a,col:b};break;}
     const i=a*width+b,x=cells[i];

   }else if(h.g1){
    h.text=h.depth===1?'先处理 G1 冲突：'+coord(h.index)+'与'+coord(h.partner)+'互相拍到。再点提示，看为什么要收回其中一台。':h.depth===2?'G1 规定监控柱不能出现在其他监控画面中：两台同排或同列、中间没有展墙就会互拍（单向拍到也算），即使全部目标都已监控也不能通关。普通地面被交叉覆盖没关系。再点提示标位。':'先收回'+coord(h.index)+'的监控柱：它与'+coord(h.partner)+'互相拍到。若还有冲突，下一次提示会继续优先处理；请自己点击收回。';
   }else h.text=h.depth===1?'当前布局需要挪动一'+T.unit+T.device+'。再点提示，看看为什么不能保留。':h.depth===2?'本关已穷举验证：在 '+L.budget+' '+T.unit+'预算内，保留这个位置无法完成合法全覆盖。'+(L.doubles.length?'本关还须满足双源靶，并借固定镜面反射补入独立来源；16/16不等于双源合格。':L.g1?'本关还须满足 G1 不互拍，玻璃展柜自身也要被看到。':'先腾出设备，再考虑未覆盖区域。')+'再点提示标位。':'先收回'+coord(h.index)+'的'+T.device+'，再重新选位。提示不会替你移动设备。';
  }else h.text=h.depth===1?h.notice+' 再点提示可查看思路。':h.depth===2?h.reason+' 再点一次提示可标出位置。':h.reveal+' 请自己点击标记位置，提示不会自动放设备。';
  paintHint();say(h.text,'hint-coach');
 }
