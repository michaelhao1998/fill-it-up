<title>fill it up · 50关配置验证版 v8</title>
<style>
*{box-sizing:border-box}
:root{--page:#f4f6f7;--card:#fff;--tile:#fff;--wet:#cfe8f5;--wall:#cdd6dc;--accent:#2b7fa8;--beam:#4aa3cc;--ink:#223038;--muted:#6c7b83;--line:#dde4e8;--warn:#b3531f;--ok:#1d7a5a;--bad:#b4392f}
[data-theme="ice"]{--page:#eef7fc;--tile:#fff;--wet:#bfe2f4;--wall:#c8d7df;--accent:#2b7fa8;--beam:#4aa3cc}
[data-theme="garden"]{--page:#f3f7ee;--tile:#fffdf8;--wet:#cfe6b4;--wall:#d8d3c2;--accent:#5b8436;--beam:#79a84b}
[data-theme="stage"]{--page:#f6f2fb;--tile:#fffdf9;--wet:#f5e2a8;--wall:#d6d2dd;--accent:#8a63ae;--beam:#c79a3e}
[data-theme="museum"]{--page:#f2f6f7;--tile:#fff;--wet:#bfe0e6;--wall:#cdd6d9;--accent:#3b6d78;--beam:#4b97a5}
[data-theme="fire"]{--page:#fbf3ee;--tile:#fffdfa;--wet:#c7dce8;--wall:#d9d2ca;--accent:#b45b2c;--beam:#3f8fb8}
[data-theme="signal"]{--page:#f0f5f7;--tile:#fff;--wet:#b9e2d5;--wall:#cbd8dc;--accent:#287e75;--beam:#3aa08c}
[data-theme="rune"]{--page:#f8f4ee;--tile:#fffdf7;--wet:#e6d4ef;--wall:#dcd3c6;--accent:#7853a3;--beam:#9a6dc0}
[data-theme="space"]{--page:#f1f5f7;--tile:#fff;--wet:#c9e6e9;--wall:#cbd6dc;--accent:#36718c;--beam:#4fa3ae}
[data-theme="warehouse"]{--page:#f8f5ee;--tile:#fffdf8;--wet:#d9e9c4;--wall:#d8d0bd;--accent:#6a7c34;--beam:#84a748}
[data-theme="workshop"]{--page:#f7f3ef;--tile:#fffdfa;--wet:#f4cba9;--wall:#d6d2cc;--accent:#b3662f;--beam:#d98a45}
html,body{margin:0;background:var(--page);color:var(--ink);font-family:"Microsoft YaHei","微软雅黑",system-ui,sans-serif}
.mono,.num{font-family:"IBM Plex Mono",Consolas,monospace}
.app{max-width:440px;margin:0 auto;padding:12px 12px 22px;position:relative;min-height:100vh}
h1{font-size:16px;margin:0 0 2px;font-weight:500}
.sub{font-size:11px;color:var(--muted);line-height:1.5}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px 12px;margin-top:7px}
.levelnav{display:flex;gap:6px;align-items:center;margin-top:9px}
.levelnav select{flex:1;min-width:0;height:32px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);font:13px "Microsoft YaHei",sans-serif;padding:0 6px}
.navbtn{height:32px;min-width:34px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);cursor:pointer;font-size:13px}
.navbtn:disabled{opacity:.35;cursor:default}
.segline{font-size:11px;color:var(--muted);margin-top:6px;line-height:1.5}
.themebar{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.themebar b{font-size:14px;font-weight:500}
.themebar .tag{font-size:10px;border:1px solid var(--line);border-radius:5px;padding:1px 5px;color:var(--muted)}
.intro{font-size:12px;line-height:1.6;margin-top:6px}
.resources{display:flex;gap:8px;align-items:center}
.typebtns{display:flex;gap:5px;flex-wrap:wrap;flex:1;min-width:0}
.typebtn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:4px 7px;font-size:11px;color:var(--ink);cursor:pointer;line-height:1.3;text-align:left}
.typebtn.on{border-color:var(--accent);background:var(--wet);font-weight:500}
.typebtn:disabled{opacity:.4;cursor:default}
.typebtn small{display:block;color:var(--muted);font-size:10px;font-weight:400}
.prog{min-width:88px;text-align:right}
.prog strong{font-size:16px;font-weight:500}
.prog small{display:block;font-size:10px;color:var(--muted)}
.bar{height:5px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .18s}
.roomtop{display:flex;justify-content:space-between;align-items:center;font-size:12px;margin-bottom:7px}
.roomtop b{font-weight:500}
.grid-shell{position:relative;padding:14px 6px 6px 20px}
.cols{position:absolute;left:20px;right:6px;top:0;display:grid;gap:3px;font:10px "IBM Plex Mono",monospace;color:var(--muted);text-align:center}
.rows{position:absolute;left:0;top:14px;bottom:6px;display:grid;gap:3px;font:10px "IBM Plex Mono",monospace;color:var(--muted);align-items:center;text-align:center;width:16px}
.board{position:relative;display:grid;gap:3px;aspect-ratio:var(--ar);width:100%}
.cell{position:relative;border:1px solid var(--line);border-radius:6px;background:var(--tile);padding:0;min-width:0;overflow:hidden;cursor:pointer;font-family:inherit;color:var(--ink);display:flex;align-items:center;justify-content:center}
.cell:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.cell.wet{background:var(--wet)}
.cell.wall{background:var(--wall);cursor:not-allowed;border-color:transparent}
.cell.protect{background:repeating-linear-gradient(45deg,#fff3e8,#fff3e8 5px,#ffe0c8 5px,#ffe0c8 10px);border-color:#d99f70;cursor:not-allowed}
.cell.protect.hit{box-shadow:inset 0 0 0 3px var(--bad)}
.cell.noplace{background:#e7f2fa;border-color:#8bb8d4;cursor:not-allowed}
.cell.double{background:#fff5d8;border-color:#d6b25f;cursor:not-allowed}
.cell.mirror{background:#eef1f8;border-color:#9cabc4;cursor:not-allowed}
.cell.gate{background:#edf4ec;border-color:#8eb58a;cursor:not-allowed}
.cell.conflict{box-shadow:inset 0 0 0 3px var(--bad)}
.cell.hint{box-shadow:inset 0 0 0 3px #d9a000}
.cell.remove-hint{box-shadow:inset 0 0 0 3px var(--bad)}
.cell .glyph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
.cell .glyph svg{width:78%;height:78%}
.cell .tag{position:absolute;top:1px;left:2px;font-size:8px;line-height:1.1;color:var(--muted);pointer-events:none;z-index:2}
.cell .badge{position:absolute;bottom:1px;right:2px;font:9px "IBM Plex Mono",monospace;color:var(--accent);pointer-events:none;z-index:2}
.cell .dev{position:absolute;inset:8%;border-radius:7px;background:#fff;border:2px solid var(--accent);display:flex;align-items:center;justify-content:center;z-index:3;pointer-events:none}
.cell .dev.b{border-style:dashed;border-color:var(--warn)}
.cell .dev .rng{position:absolute;right:-4px;top:-5px;background:var(--warn);color:#fff;border-radius:7px;min-width:13px;height:13px;font:9px/13px "IBM Plex Mono",monospace;text-align:center;z-index:6}
.cell .terrain{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:1}
.cell .terrain .wet-detail{display:none}
.cell.wet .terrain .wet-detail{display:block}
.cell.wet .terrain .dry-detail{display:none}
.cell .glyph.obstacle-glyph{inset:0}
.cell .glyph.obstacle-glyph svg{width:100%;height:100%}
.cell .dev{z-index:4}
.dev-base{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.dev-base svg{width:100%;height:100%}
.dev-mark{position:absolute;inset:-3px;display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:5}
.dev-mark svg{width:100%;height:100%}
.themeicon{display:inline-block;width:24px;height:24px;vertical-align:-6px;margin-right:3px}
.themeicon svg{width:100%;height:100%}
.tbicon{display:inline-block;width:18px;height:18px;vertical-align:-5px;margin-right:3px}
.tbicon svg{width:100%;height:100%}
.tbicon.b{outline:1px dashed var(--warn);border-radius:3px}
#beams{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:2;overflow:visible}
.status{font-size:11px;line-height:1.5;margin-top:7px;padding:6px 8px;border-radius:7px;background:#f2f6f7;color:var(--muted)}
.status.bad{background:#fdeeeb;color:var(--bad)}
.status.ok{background:#eaf6f0;color:var(--ok)}
.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
.actions button{flex:1;min-width:56px;height:34px;padding:0 2px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);font:12px "Microsoft YaHei",sans-serif;cursor:pointer;white-space:nowrap}
.actions button:active{background:var(--wet)}
.coach{font-size:11.5px;line-height:1.55;min-height:32px}
.coach b{color:var(--accent);font-weight:500}
.mech{font-size:11px;line-height:1.65;color:var(--muted)}
.mech summary{cursor:pointer;color:var(--ink)}
.mech .replay{margin-top:6px;border:1px solid #e0b64a;background:#fff8e1;color:#8a5a00;border-radius:7px;padding:3px 9px;font-size:11px;font-family:inherit;cursor:pointer}
footer{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-top:10px;font-size:10px;color:var(--muted)}
footer button{border:none;background:none;color:var(--accent);font-size:10px;text-decoration:underline;cursor:pointer;font-family:inherit}
#guide{position:absolute;inset:0;z-index:60;pointer-events:none;display:none}
#guide.on{display:block}
#gMask{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
#gMask *{pointer-events:none}
#gMask .shade{fill:rgba(20,22,28,.5);fill-rule:evenodd}
#gMask .ring{fill:none;stroke:#f0b400;stroke-width:2;animation:gring 1s ease-in-out infinite}
@keyframes gring{50%{stroke-width:4;stroke-opacity:.55}}
.bub{position:absolute;left:10px;right:10px;background:#fffdf3;border:2px solid #f0b400;border-radius:12px;padding:10px 12px;font-size:12px;line-height:1.6;color:#1f2329;pointer-events:none;box-shadow:0 5px 16px rgba(0,0,0,.18)}
.bub .tag{display:inline-block;font-size:10px;color:#fff;background:#d98a00;border-radius:4px;padding:0 5px;margin-right:6px}
.bub .gb{float:right;margin:0 0 4px 8px;height:27px;padding:0 11px;border-radius:8px;border:1px solid #d9a000;background:#f0b400;color:#3b2a00;font-family:inherit;font-size:12px;cursor:pointer;pointer-events:auto}
.bub:after{content:"";position:absolute;left:var(--ax,50%);border:8px solid transparent}
.bub.below:after{top:-10px;border-top:0;border-bottom:9px solid #f0b400}
.bub.above:after{bottom:-10px;border-bottom:0;border-top:9px solid #f0b400}
dialog{border:1px solid var(--line);border-radius:14px;max-width:400px;width:calc(100% - 28px);padding:16px;color:var(--ink);background:#fff;font-family:inherit}
dialog::backdrop{background:rgba(20,22,28,.4)}
dialog h2{font-size:16px;margin:0 0 4px;font-weight:500}
dialog .sub{font-size:12px;margin:0 0 8px}
dialog .body{font-size:12px;line-height:1.7;max-height:52vh;overflow:auto}
dialog .body p{margin:6px 0}
dialog .button-row{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap}
dialog .button-row button{flex:1;min-width:90px;height:34px;border:1px solid var(--line);border-radius:8px;background:#fff;font-family:inherit;font-size:12px;cursor:pointer}
dialog .button-row button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
dialog .fine{font-size:10px;color:var(--muted);margin:8px 0 0}
#fatal{margin-top:10px;padding:10px;border-radius:8px;background:#fdeeeb;color:var(--bad);font-size:12px}
@media(max-width:360px){.grid-shell{padding-left:17px}.cols{left:17px}.rows{width:14px}.cell{border-radius:5px}}
</style>

<script id="engine">
'use strict';
(function(){
const ORTH={U:[-1,0],R:[0,1],D:[1,0],L:[0,-1]};
const GATE={'>':[0,1],'<':[0,-1],'^':[-1,0],'v':[1,0]};
const DIAG=[[-1,-1],[-1,1],[1,-1],[1,1]];
const ORDER=['U','R','D','L'];
const DIRCN={U:'上',R:'右',D:'下',L:'左','上':'U','右':'R','下':'D','左':'L'};
function coord(i,w){return String.fromCharCode(65+i%w)+'列'+(Math.floor(i/w)+1)+'行';}
function parseLevel(raw){
  const w=raw.width,h=raw.height,cells=raw.rows.join('').split('');
  const targets=[],forbidden=[],doubles=[],mirrors=[],gates=[],candidates=[],walls=[];
  cells.forEach((x,i)=>{
    if(x==='#')walls.push(i);
    else if(x==='P')forbidden.push(i);
    else if(x==='N')targets.push(i);
    else if(x==='D'){targets.push(i);doubles.push(i);}
    else if(x==='/'||x==='\\')mirrors.push(i);
    else if(GATE[x])gates.push(i);
    else if(x==='.'){targets.push(i);candidates.push(i);}
  });
  const emitters={};raw.emitters.forEach(e=>emitters[e.key]={key:e.key,mechanic:e.mechanic,range:e.range,budget:e.budget,name:e.name,directional:e.mechanic==='E3',diagonal:e.mechanic==='E4'});
  return {raw,w,h,cells,targets,forbidden,doubles,mirrors,gates,candidates,walls,emitters,require2:new Set(doubles),
    g1:!!raw.rules.g1,e5:!!raw.rules.e5,newMech:raw.rules.newMechanic,specials:raw.rules.specials};
}
function initialRays(mechanic,dir){
  if(mechanic==='E3')return [ORTH[dir||'U']];
  if(mechanic==='E4')return DIAG.slice();
  return ORDER.map(d=>ORTH[d]);
}
function trace(L,source,mechanic,dir,range){
  const hits=new Set([source]),direct=new Set([source]),after=new Set(),paths=[];
  const r0=Math.floor(source/L.w),c0=source%L.w;
  for(const d0 of initialRays(mechanic,dir)){
    let r=r0,c=c0,dr=d0[0],dc=d0[1],steps=0,turned=false,end='boundary';
    const seen=new Set(),path=[{i:source,dr,dc}];
    for(;;){
      const a=r+dr,b=c+dc;
      if(a<0||a>=L.h||b<0||b>=L.w){end='boundary';break;}
      const j=a*L.w+b,x=L.cells[j],diagonal=Math.abs(dr)+Math.abs(dc)===2;
      if(x==='#'){end='wall';break;}
      if(GATE[x]&&(diagonal||GATE[x][0]!==dr||GATE[x][1]!==dc)){end='gate';break;}
      if((x==='/'||x==='\\')&&diagonal){end='mirror';break;}
      if(range!=null&&steps>=range){end='range';break;}
      const key=j+','+dr+','+dc;
      if(seen.has(key)){end='loop';break;}
      seen.add(key);path.push({i:j,dr,dc});hits.add(j);(turned?after:direct).add(j);steps++;
      if(x==='/'){const t=dr;dr=-dc;dc=-t;turned=true;}
      else if(x==='\\'){const t=dr;dr=dc;dc=t;turned=true;}
      r=a;c=b;
    }
    paths.push({path,end});
  }
  return {hits,direct,after,paths};
}
function emitterOf(L,type){return L.emitters[type]||{mechanic:'E0',range:null,name:'设备'};}
function coverage(L,placements){
  const count=new Map(),sources=new Map(),traces=[];
  for(const p of placements){
    const e=emitterOf(L,p.type),t=trace(L,p.index,e.mechanic,p.dir,e.range);
    traces.push({p,t});
    for(const j of t.hits){
      if(!count.has(j)){count.set(j,0);sources.set(j,[]);}
      count.set(j,count.get(j)+1);sources.get(j).push(p.index);
    }
  }
  let covered=0;const unmet=[],violations=[],doubleStatus=[];
  for(const j of L.targets){
    const n=count.get(j)||0;
    if(n>=1)covered++;
    if(L.require2.has(j)){doubleStatus.push({index:j,count:n,sources:sources.get(j)||[],required:2});if(n<2)unmet.push(j);}
    else if(n<1)unmet.push(j);
  }
  for(const j of L.forbidden)if((count.get(j)||0)>0)violations.push(j);
  const emitterHits=[];
  if(L.g1)for(const a of placements)for(const b of placements){
    if(a.index===b.index)continue;
    const t=traces.find(z=>z.p===a).t;
    if(t.hits.has(b.index)&&!emitterHits.some(q=>(q[0]===b.index&&q[1]===a.index)))emitterHits.push([a.index,b.index]);
  }
  const ok=unmet.length===0&&violations.length===0&&emitterHits.length===0;
  return {count,sources,traces,covered,total:L.targets.length,unmet,violations,doubleStatus,emitterHits,ok};
}
function won(L,placements){
  const used={};for(const p of placements)used[p.type]=(used[p.type]||0)+1;
  for(const k in L.emitters)if((used[k]||0)>L.emitters[k].budget)return false;
  const seen=new Set();
  for(const p of placements){
    if(L.cells[p.index]!=='.')return false;
    if(seen.has(p.index))return false;seen.add(p.index);
    const e=emitterOf(L,p.type);
    if(e.mechanic==='E3'&&!ORDER.includes(p.dir))return false;
  }
  return coverage(L,placements).ok;
}
function fromConfig(raw,entry){return {index:entry.index,type:entry.type||'A',dir:DIRCN[entry.dir]||entry.dir||null};}
function answerPlacements(raw){const L=parseLevel(raw);return raw.solution.map(s=>fromConfig(raw,s));}
function selfTest(data){
  const out={levels:0,answerWins:0,counterexamples:0,counterexampleLoses:0,failures:[]};
  for(const raw of data.levels){
    const L=parseLevel(raw);out.levels++;
    if(won(L,answerPlacements(raw)))out.answerWins++;
    else out.failures.push(raw.code+' 参考答案未通关');
    for(const c of raw.tests.counterexamples){
      out.counterexamples++;
      const pl=c.layout.map(x=>fromConfig(raw,x));
      if(!won(L,pl))out.counterexampleLoses++;
      else out.failures.push(raw.code+' 反例被判通关：'+c.rule);
    }
  }
  out.pass=out.failures.length===0&&out.answerWins===50&&out.counterexamples===out.counterexampleLoses;
  return out;
}
window.FillItUpEngine={parseLevel,trace,coverage,won,answerPlacements,fromConfig,selfTest,coord,emitterOf,ORDER,ORTH,GATE,DIRCN};
})();
</script>
<script id="game">
'use strict';
(function(){

const $=id=>document.getElementById(id);
const COLORS=['#c8792e','#2f7fa8','#8a5aa8','#3c8f62','#b45050','#7b7f36','#2f6f86','#a05f8a','#4d7b3e','#a8703a'];
const states=new Map();let active=0,curType='A',hintPos=0,hintStage=0,selftest=null;

  C2:['这一格要两台不同设备照到，同一台照两次不算','状态栏单独显示来源槽 0/2 → 1/2 → 2/2；只看不同设备数。'],

  E2:['每个方向只覆盖规定格数，不再像前几关那样覆盖整条线','框出的就是这一台实际喷到的格子，线头短横线表示射程到此为止。'],
  R2:['只有顺着箭头的射线能穿过','被挡住的方向会在格前画截止标记，和墙的停止分开显示。'],

  E4:['这种设备只沿斜线发光，横竖方向不亮','框出四条对角线；横竖相邻的格子不会被它覆盖。'],
  E5:['本关有两种设备，各有数量，先选类型再放','预算区可切换 A / B；两种设备覆盖范围不同，各自单独计数。'],
};
function L(i){if(!states.has(i)){const Lv=E.parseLevel(LEVELS[i]);states.set(i,{L:Lv,placements:[],history:[],cleared:false,coach:'',hintCells:[],removeHint:null});}return states.get(i);}
function cur(){return L(active);}
function theme(){const raw=LEVELS[active];return THEMES[raw.theme]||{name:raw.themeName,device:'设备',beam:'光线',target:'目标',verb:'覆盖',covered:'已覆盖',block:'阻挡',unit:'台',palette:''};}
function mechName(m){return m;}

function describeMech(m,T){if(m==='E0')return T.device+'（基础发射器）';if(m==='C0')return T.block+'（阻挡格）';if(m==='E5'&&T.E5)return 'A：'+T.E5.A+'；B：'+T.E5.B+'（两种设备分类型计数）';const s=skin(T,m);return (s?s+'：':'')+m;}

function buildLevelSelect(){
  const sel=$('levelsel');sel.innerHTML=LEVELS.map((r,i)=>{
    const seg=THEMES[r.theme]?THEMES[r.theme].name:r.themeName;
    return '<option value="'+i+'">L'+String(r.id).padStart(2,'0')+' · '+seg+' · '+(r.rules.specials.join('+')||'基础')+'</option>';

function go(i){

  $('themename').textContent=T.name;$('themeicon').innerHTML=skinOf().emitter||'';$('scene').textContent=raw.scene;$('board-size').textContent=raw.width+'×'+raw.height+(raw.emitters[0].range?' · 射程 '+raw.emitters[0].range:'');

  $('target-total').textContent=' / '+cur().L.targets.length;
  $('coverage-label').textContent=T.covered||'已覆盖';
  $('cols').style.gridTemplateColumns='repeat('+raw.width+',1fr)';
  $('rows').style.gridTemplateRows='repeat('+raw.height+',1fr)';
  $('cols').style.gridTemplateColumns='repeat('+raw.width+',1fr)';

 '<p>参考答案通关：<b>'+selftest.answerWins+'/'+selftest.levels+'</b></p><p>错误反例判负：<b>'+selftest.counterexampleLoses+'/'+selftest.counterexamples+'</b></p><p>最少预算与唯一解由 <span class="mono">tools/gen50/verify.py</span> 独立复核，本页只复验胜负判定。</p>'+(selftest.failures.length?'<p style="color:#b4392f">'+selftest.failures.join('<br>')+'</p>':''),
 [{label:'关闭',primary:true,run:()=>{}}],'自检结果同时输出到浏览器控制台。');
window.addEventListener('resize',()=>{fitBoard();drawBeams(E.coverage(cur().L,cur().placements));refreshGuide();});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&guide.on)hideGuide();});
// ── 启动 ──
try{
  selftest=E.selfTest(DATA);
  console.log('[fill it up] selfTest',selftest.pass?'PASS':'FAIL',selftest);
  if(!selftest.pass){$('fatal').hidden=false;$('fatal').textContent='开页自检未通过：'+selftest.failures.slice(0,3).join('；');}
  buildLevelSelect();go(0);
  window.FillItUp={getState:()=>{const S=cur(),C=E.coverage(S.L,S.placements);return {active,code:LEVELS[active].code,theme:LEVELS[active].theme,newMechanic:LEVELS[active].rules.newMechanic,placements:S.placements.slice(),curType,cleared:S.cleared,covered:C.covered,total:C.total,ok:C.ok,violations:C.violations,doubleStatus:C.doubleStatus,emitterHits:C.emitterHits,budget:LEVELS[active].budgetTotal};},guide:()=>({on:guide.on,step:guide.step,shown:guide.shown[active]||false,firstShown:guide.firstShown[active]||false}),go,selfTest:()=>selftest,engine:E,levels:LEVELS};
}catch(err){$('fatal').hidden=false;$('fatal').textContent='启动失败：'+err.message;console.error(err);}
})();
</script>
