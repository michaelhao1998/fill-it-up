<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="color-scheme" content="light">
<title>fill it up · 推理难度体验 v1（10 关样本）</title>
<style>
:root{--page:#f4f6f7;--card:#fff;--tile:#fff;--wet:#cfe8f5;--wall:#cdd6dc;--accent:#2b7fa8;--beam:#4aa3cc;--ink:#223038;--muted:#6c7b83;--line:#dde4e8;--warn:#b3531f;--ok:#1d7a5a;--bad:#b4392f;--gold:#d9a000}
[data-theme="ice"]{--page:#eef7fc;--wet:#bfe2f4;--wall:#c8d7df;--accent:#2b7fa8;--beam:#4aa3cc}
[data-theme="garden"]{--page:#f3f7ee;--tile:#fffdf8;--wet:#cfe6b4;--wall:#d8d3c2;--accent:#5b8436;--beam:#79a84b}
[data-theme="stage"]{--page:#f6f2fb;--tile:#fffdf9;--wet:#f5e2a8;--wall:#d6d2dd;--accent:#8a63ae;--beam:#c79a3e}
[data-theme="museum"]{--page:#f2f6f7;--wet:#bfe0e6;--wall:#cdd6d9;--accent:#3b6d78;--beam:#4b97a5}
[data-theme="fire"]{--page:#fbf3ee;--tile:#fffdfa;--wet:#c7dce8;--wall:#d9d2ca;--accent:#b45b2c;--beam:#3f8fb8}
[data-theme="space"]{--page:#f1f5f7;--wet:#c9e6e9;--wall:#cbd6dc;--accent:#36718c;--beam:#4fa3ae}
[data-theme="warehouse"]{--page:#f8f5ee;--tile:#fffdf8;--wet:#d9e9c4;--wall:#d8d0bd;--accent:#6a7c34;--beam:#84a748}
*{box-sizing:border-box}
html,body{margin:0;background:var(--page);color:var(--ink);font-family:"Microsoft YaHei","微软雅黑",system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
.num{font-family:"IBM Plex Mono",Consolas,monospace}
#app{max-width:440px;margin:0 auto;padding:10px 12px 18px;position:relative;min-height:100vh}
.top{display:flex;align-items:center;gap:8px;font-size:12px}
.top .pill{display:inline-flex;align-items:center;gap:4px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:3px 9px}
.top .pill b{font-size:13px}
.top .sp{flex:1}
.top button{border:1px solid var(--line);background:#fff;border-radius:8px;height:28px;padding:0 9px;font:12px inherit;font-family:inherit;color:var(--ink);cursor:pointer}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:9px}
.title{display:flex;align-items:baseline;gap:7px;flex-wrap:wrap}
.title h1{font-size:16px;margin:0}
.tier{font-size:11px;padding:1px 7px;border-radius:5px;color:#fff;background:#7b8a91}
.tier.t0{background:#5a9a72}.tier.t1{background:#3f86a8}.tier.t2{background:#c07b2c}.tier.t3{background:#b4392f}
.sub{font-size:12px;color:var(--muted);margin-top:4px;line-height:1.55}
.mechs{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.mechs span{font-size:11px;background:#f2f5f6;border:1px solid var(--line);border-radius:6px;padding:2px 6px;line-height:1.45}
.mechs span b{color:var(--accent)}
.hud{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
.hud div{background:#f6f8f9;border-radius:8px;padding:5px 6px;text-align:center;font-size:11px;color:var(--muted)}
.hud div b{display:block;font-size:17px;color:var(--ink);font-family:"IBM Plex Mono",Consolas,monospace}
.hud .low b{color:var(--bad)}
.boardwrap{position:relative;margin:10px auto 0;touch-action:none;user-select:none;-webkit-user-select:none}
.board{display:grid;gap:3px;position:relative}
.cell{position:relative;aspect-ratio:1/1;border-radius:7px;background:var(--tile);border:1px solid var(--line);overflow:hidden;cursor:pointer}
.cell.wet{background:var(--wet)}
.cell.wall{background:var(--wall);cursor:default;border-color:transparent}
.cell.noplace{background:#e7f2fa;border:1.5px dashed #8bb8d4;cursor:default}
.cell.noplace.wet{background:#bfe0f2}
.cell.double{background:#fff5d8;border:1.5px solid #d6b25f;cursor:default}
.cell.double.full{background:#ffe7a3}
.cell.protect{background:#fff3f1;border:1.5px dashed #d47e72;cursor:default}
.cell.protect.hit{background:#f9c9c2;border:2px solid var(--bad)}
.cell.mirror{background:#eef1f8;border-color:#9cabc4;cursor:default}
.cell .terrain{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;opacity:.85}
.cell .terrain .wet-detail{display:none}.cell.wet .terrain .wet-detail{display:block}.cell.wet .terrain .dry-detail{display:none}
.cell .obs{position:absolute;inset:0}.cell .obs svg{width:100%;height:100%}
.cell .lbl{position:absolute;left:0;right:0;bottom:2px;text-align:center;font-size:9px;line-height:1.1;color:var(--muted);pointer-events:none}
.cell .ico{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
.cell .ico svg{width:70%;height:70%}
.cell .slots{position:absolute;top:4px;left:0;right:0;display:flex;justify-content:center;gap:4px;pointer-events:none}
.cell .slots i{width:9px;height:9px;border-radius:50%;border:1.5px solid #b48c35;background:#fff}
.cell .dev{position:absolute;inset:7%;border-radius:8px;background:#fff;border:2px solid var(--dc,var(--accent));z-index:3;pointer-events:none}
.cell .dev svg{width:100%;height:100%}
.cell .dev .rng{position:absolute;right:-5px;top:-6px;background:var(--warn);color:#fff;border-radius:7px;min-width:14px;height:14px;font:9px/14px Consolas,monospace;text-align:center}
.cell.conflict .dev{border-color:var(--bad);box-shadow:0 0 0 3px rgba(180,57,47,.25)}
.cell.hintcell{box-shadow:inset 0 0 0 3px var(--gold)}
.cell.hintwrong{box-shadow:inset 0 0 0 3px var(--bad)}
.cell.pv{outline:2px solid var(--accent);outline-offset:-2px}
.cell.pvnew::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(45deg,rgba(43,127,168,.18) 0 4px,transparent 4px 8px);pointer-events:none;z-index:2}
.coord{position:absolute;font-size:9px;color:var(--muted);font-family:Consolas,monospace}
#beams{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:4;overflow:visible}
.status{font-size:12px;line-height:1.55;margin-top:8px;padding:7px 9px;border-radius:8px;background:#f2f6f7;color:var(--muted);min-height:36px}
.status.bad{background:#fdeeeb;color:var(--bad)}.status.ok{background:#eaf6f0;color:var(--ok)}.status.info{background:#eef5fa;color:#2b6a88}
.actions{display:flex;gap:6px;margin-top:9px}
.actions button{flex:1;height:38px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--ink);font:13px "Microsoft YaHei",sans-serif;cursor:pointer}
.actions button:disabled{opacity:.45;cursor:not-allowed}
.actions button.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.tip{font-size:11px;color:var(--muted);margin-top:7px;line-height:1.55}
.levels{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}
.lvbtn{display:flex;flex-direction:column;gap:3px;text-align:left;border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 10px;cursor:pointer;font-family:inherit;color:var(--ink)}
.lvbtn .r1{display:flex;gap:6px;align-items:center;font-size:13px;font-weight:600}
.lvbtn .r2{font-size:11px;color:var(--muted)}
.lvbtn .done{margin-left:auto;color:var(--ok);font-size:12px}
.lvbtn .free{font-size:10px;color:var(--ok);border:1px solid #a9d3be;border-radius:4px;padding:0 4px}
dialog{border:none;border-radius:14px;padding:0;width:min(92vw,420px);max-height:88vh;box-shadow:0 12px 40px rgba(0,0,0,.25)}
dialog::backdrop{background:rgba(20,26,30,.45)}
.dlg{padding:14px 15px 15px;overflow:auto;max-height:88vh}
.dlg h2{margin:0 0 6px;font-size:17px}
.dlg p{font-size:13px;line-height:1.6;margin:6px 0}
.dlg table{width:100%;border-collapse:collapse;font-size:12px;margin:8px 0}
.dlg td,.dlg th{border-bottom:1px solid var(--line);padding:5px 4px;text-align:left;vertical-align:top}
.dlg th{color:var(--muted);font-weight:500}
.dlg .row{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
.dlg .row button{flex:1;min-width:64px;padding:0 4px;height:36px;border-radius:9px;border:1px solid var(--line);background:#fff;font:13px "Microsoft YaHei",sans-serif;cursor:pointer}
.dlg .row button.pri{background:var(--accent);color:#fff;border-color:var(--accent)}
.dlg .row button.on{background:#223038;color:#fff}
.chain{margin:6px 0 0;padding-left:18px;font-size:12px;line-height:1.65}
.chain .tg{display:inline-block;font-size:10px;border-radius:4px;padding:0 5px;margin-right:4px;color:#fff;vertical-align:1px}
.tg.easy{background:#5a9a72}.tg.mid{background:#3f86a8}.tg.deep{background:#c07b2c}.tg.guess{background:#b4392f}
.form{display:grid;grid-template-columns:1fr 92px;gap:6px 10px;align-items:center;font-size:13px}
.form input{height:30px;border:1px solid var(--line);border-radius:7px;padding:0 7px;font:13px Consolas,monospace;width:100%}
textarea{width:100%;height:150px;font:11px/1.5 Consolas,monospace;border:1px solid var(--line);border-radius:8px;padding:6px}
#coachbox{position:absolute;left:10px;right:10px;z-index:30;background:#fffdf3;border:2px solid var(--gold);border-radius:12px;padding:10px 12px;font-size:13px;line-height:1.6;box-shadow:0 6px 18px rgba(0,0,0,.18);display:none}
#coachbox.on{display:block}
#coachbox b{color:#8a5a00}
#coachbox .cb{display:flex;justify-content:flex-end;gap:8px;margin-top:6px}
#coachbox button{height:30px;padding:0 12px;border-radius:8px;border:1px solid #d9a000;background:#f0b400;color:#3b2a00;font:12px "Microsoft YaHei",sans-serif;cursor:pointer}
#coachbox button.ghost{background:#fff;color:#8a5a00}
.board.locked .cell{cursor:default}
.board.locked .cell.focus{cursor:pointer;box-shadow:inset 0 0 0 3px var(--gold);animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:inset 0 0 0 5px rgba(217,160,0,.45)}}
.hidden{display:none!important}
</style>
</head>
<body>
<div id="app" data-theme="stage">
  <div class="top">
    <span class="pill">体力 <b class="num" id="st">50</b><span class="num" id="stmax">/50</span></span>
    <span class="pill num" id="regen" title="下一点体力恢复">满</span>
    <span class="sp"></span>
    <button id="btn-levels">选关</button>
    <button id="btn-log">体验记录</button>
    <button id="btn-admin">后台</button>
  </div>

  <section id="menu" class="card">
    <div class="title"><h1>推理难度体验 · 10 关样本</h1></div>
    <p class="sub">每关唯一解、预算即最少设备数。<b>按住格子可预览覆盖范围</b>（不放置、不扣撤回）；点一下放置；点已放的设备会收回，<b>收回和撤销都消耗撤回次数</b>。撤回用完且设备摆满仍未通关即失败。<br>开局扣体力，通关返还；失败不返还。第 1 关有新手指引。</p>
    <div class="levels" id="levels"></div>
    <p class="tip">档位只用于你校准难度：入门 / 普通 / 挑战 / 难题。通关或失败后可查看本关的推理链与生成器测得的难度数据，并给出主观评价，最后在“体验记录”里一键复制发回。</p>
  </section>

  <section id="game" class="hidden">
    <div class="card">
      <div class="title"><h1 id="lvtitle"></h1><span class="tier" id="lvtier"></span></div>
      <div class="sub" id="lvgoal"></div>
      <div class="mechs" id="lvmechs"></div>
      <div class="hud">
        <div id="hud-dev">设备<b class="num" id="h-dev">0/0</b></div>
        <div id="hud-undo">撤回剩余<b class="num" id="h-undo">5</b></div>
        <div>已覆盖<b class="num" id="h-cov">0/0</b></div>
      </div>
      <div class="boardwrap" id="bw">
        <div class="board" id="board"></div>
        <svg id="beams"></svg>
      </div>
      <div class="status" id="status"></div>
      <div class="actions">
        <button id="btn-undo">撤销</button>
        <button id="btn-hint">提示</button>
        <button id="btn-restart">重开</button>
        <button id="btn-quit">放弃</button>
      </div>
      <p class="tip">按住 0.3 秒预览：虚线是这一台会照到的范围，斜纹格是新增覆盖；预览不放置、不扣撤回。</p>
    </div>
    <div id="coachbox"><div id="coachtext"></div><div class="cb"><button class="ghost" id="coachskip">跳过指引</button><button id="coachnext">下一步</button></div></div>
  </section>
</div>

<dialog id="dlg"><div class="dlg" id="dlgbody"></div></dialog>

const TIERCLS={入门:'t0',普通:'t1',挑战:'t2',难题:'t3'};
const STEPNAME={T1:['明显死角','easy'],T2:['隐蔽死角','easy'],D:['路口推理','mid'],T3:['机制排除','deep'],T4:['最后一台','mid'],T5:['一步反证','deep'],G:['尝试','guess']};
const LC=s=>String(s).replace(/([A-F])(\d)/g,'$1列$2行');
const coordOf=(i,W)=>String.fromCharCode(65+i%W)+'列'+(Math.floor(i/W)+1)+'行';
const short=s=>(s||'').split('（')[0];

/* ───────── 配置（后台可调） ───────── */
const CFG={undo:5,max:50,cost:10,regenSec:180,refund:10,freeLevels:1,showTier:true};
let stamina=CFG.max,regenAt=null;

/* ───────── 规则引擎 ───────── */
function prep(raw){
  const W=raw.w,H=raw.h,cells=raw.rows.join('').split('');
  const range=raw.types[0].kind==='E2'?raw.types[0].range:null;
  const targets=[],need={};
  cells.forEach((x,i)=>{if(x==='.'||x==='N'||x==='D'){targets.push(i);need[i]=x==='D'?2:1;}});
  const L={raw,W,H,cells,range,targets,need,g1:!!raw.g1,cache:{}};
  return L;
}
function trace(L,s){
  if(L.cache[s])return L.cache[s];
  const {W,H,cells}=L,hits=new Set([s]),rays=[];
  for(const [dr0,dc0] of [[-1,0],[1,0],[0,-1],[0,1]]){
    let r=Math.floor(s/W),c=s%W,dr=dr0,dc=dc0,k=0,end='boundary';const seen=new Set(),path=[];
    while(true){
      const a=r+dr,b=c+dc;
      if(a<0||a>=H||b<0||b>=W){end='boundary';break;}
      const j=a*W+b,x=cells[j];
      if(x==='#'){end='wall';break;}
      if(L.range!==null&&k>=L.range){end='range';break;}
      const st=j*16+(dr+1)*4+(dc+1);if(seen.has(st)){end='loop';break;}
      seen.add(st);path.push(j);hits.add(j);k++;
      if(x==='/')[dr,dc]=[-dc,-dr];else if(x==='\\')[dr,dc]=[dc,dr];
      r=a;c=b;
    }
    rays.push({path,end,dir:[dr,dc]});
  }
  return L.cache[s]={hits,rays};
}
function evalBoard(L,placed){
  const src={};L.targets.forEach(t=>src[t]=new Set());
  const viol=new Set(),wet=new Set();
  placed.forEach(p=>{const tr=trace(L,p);tr.hits.forEach(h=>{wet.add(h);if(src[h])src[h].add(p);if(L.cells[h]==='P')viol.add(h);});});
  const pairs=[];
  if(L.g1)for(const a of placed)for(const b of placed)if(a!==b&&trace(L,a).hits.has(b))pairs.push([a,b]);
  let covered=0;L.targets.forEach(t=>{if(src[t].size>=L.need[t])covered++;});
  const doubles=L.targets.filter(t=>L.need[t]===2).map(t=>({t,n:src[t].size}));
  const won=covered===L.targets.length&&!viol.size&&!pairs.length;
  return {src,viol,pairs,covered,total:L.targets.length,doubles,won,wet};
}

/* ───────── 体力 ───────── */
function tickStamina(){
  const now=Date.now();
  if(stamina>=CFG.max){stamina=Math.min(stamina,CFG.max);regenAt=null;}
  else{if(!regenAt)regenAt=now+CFG.regenSec*1000;while(regenAt&&now>=regenAt&&stamina<CFG.max){stamina++;regenAt=stamina<CFG.max?regenAt+CFG.regenSec*1000:null;}}
  $('st').textContent=stamina;$('stmax').textContent='/'+CFG.max;
  if(regenAt){const s=Math.max(0,Math.ceil((regenAt-now)/1000));$('regen').textContent='+1 '+String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');}else $('regen').textContent='满';
}
setInterval(tickStamina,1000);
const isFree=i=>i<CFG.freeLevels;

/* ───────── 状态 ───────── */
let cur=null;            // 当前局
const cleared={},records=[];
function newAttempt(i){
  const raw=LV[i],L=prep(raw);
  return {i,L,placed:[],hist:[],undoLeft:CFG.undo,undoUsed:0,places:0,hints:0,hintStage:0,t0:Date.now(),status:'play',rated:null,pv:null,tut:null};
}
function startLevel(i,isRestart){
  if(!isFree(i)){
    tickStamina();
    if(stamina<CFG.cost){openNoStamina(i);return;}
    if(stamina>=CFG.max)regenAt=null;
    stamina-=CFG.cost;tickStamina();
  }
  cur=newAttempt(i);
  $('menu').classList.add('hidden');$('game').classList.remove('hidden');
  setupLevel();
  if(i===0&&!isRestart&&!cleared[0])startTutorial();
}

/* ───────── 渲染 ───────── */
function themeOf(){return TH[cur.L.raw.theme];}
function setupLevel(){
  const L=cur.L,raw=L.raw,T=themeOf();
  $('app').dataset.theme=T.key;
  $('lvtitle').textContent='S'+String(raw.id).padStart(2,'0')+' · '+T.name;
  $('lvtier').textContent=raw.tier;$('lvtier').className='tier '+TIERCLS[raw.tier];$('lvtier').classList.toggle('hidden',!CFG.showTier);
  $('lvgoal').innerHTML='用 <b>'+raw.kStar+'</b> '+T.unit+(L.range?'短射程':'')+T.device+'，'+T.verb+'全部'+T.target+'（共 '+L.targets.length+' 格）。'+(isFree(cur.i)?'<span style="color:var(--ok)">本关免体力。</span>':'');
  const M={
    C1:['C1',short(T.C1)||'禁覆盖格','不能被照到，但光会穿过它'],
    C2:['C2',short(T.C2)||'双照格','要两台不同设备照到'],
    C3:['C3',short(T.C3)||'不可放置格','不能放设备，但要被照到'],
    R1:['R1',short(T.R1)||'反射格','光碰到会转 90°'],
    G1:['G1','不得互照','设备不能出现在另一台的光里'],
    E2:['E2','短射程','每台每个方向只照 '+L.range+' 格'],
  };
  const base=['<span><b>基础</b> '+T.device+'照亮自身并四向发光，遇'+T.block+'停止</span>'];
  $('lvmechs').innerHTML=base.concat(raw.mech.map(m=>M[m]?'<span><b>'+M[m][0]+' '+M[m][1]+'</b>：'+M[m][2]+'</span>':'')).join('');
  const bw=$('bw'),maxW=Math.min(window.innerWidth-48,400),cell=Math.floor((Math.min(maxW,(window.innerHeight-330)*L.W/L.H)-(L.W-1)*3)/L.W);
  const cs=Math.max(40,Math.min(76,cell));
  bw.style.width=(cs*L.W+(L.W-1)*3)+'px';
  $('board').style.gridTemplateColumns='repeat('+L.W+','+cs+'px)';
  $('board').innerHTML=L.cells.map((_,i)=>'<div class="cell" data-cell="'+i+'"></div>').join('');
  render();
}
function svgMirror(x){return x==='/'?'<svg viewBox="0 0 40 40"><path d="M6 34L34 6" stroke="#5f6f8a" stroke-width="5" stroke-linecap="round"/></svg>':'<svg viewBox="0 0 40 40"><path d="M6 6L34 34" stroke="#5f6f8a" stroke-width="5" stroke-linecap="round"/></svg>';}
const SVG_NO='<svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="12" fill="none" stroke="#c9564a" stroke-width="3"/><path d="M12 28L28 12" stroke="#c9564a" stroke-width="3"/></svg>';
const SVG_GLASS='<svg viewBox="0 0 40 40"><rect x="9" y="9" width="22" height="22" rx="3" fill="rgba(140,190,225,.35)" stroke="#5f97bf" stroke-width="2"/><path d="M13 27l14-14" stroke="#fff" stroke-width="2"/></svg>';
function render(){
  const L=cur.L,S=SK[themeOf().key],ev=evalBoard(L,cur.placed);cur.ev=ev;
  const conflictCells=new Set();ev.pairs.forEach(([a,b])=>{conflictCells.add(a);conflictCells.add(b);});
  const pv=cur.pv,pvTr=pv!=null&&!cur.placed.includes(pv)&&L.cells[pv]==='.'?trace(L,pv):null;
  const colorOf=p=>COL[cur.placed.indexOf(p)%COL.length];
  const cells=$('board').children;
  for(let i=0;i<L.cells.length;i++){
    const x=L.cells[i],el=cells[i],cls=['cell'];let h='';
    const isWet=ev.wet.has(i);
    if(x==='#'){cls.push('wall');h=S.obstacle?'<div class="obs">'+S.obstacle+'</div>':'';}
    else if(x==='.'){if(isWet)cls.push('wet');h=S.terrain||'';}
    else if(x==='N'){cls.push('noplace');if(isWet)cls.push('wet');h='<div class="ico">'+SVG_GLASS+'</div><div class="lbl">禁放</div>';}
    else if(x==='D'){cls.push('double');const n=ev.src[i].size;if(n>=2)cls.push('full');const ss=[...ev.src[i]];h='<div class="slots">'+[0,1].map(k=>'<i style="'+(ss[k]!==undefined?'background:'+colorOf(ss[k])+';border-color:'+colorOf(ss[k]):'')+'"></i>').join('')+'</div><div class="lbl num">双照 '+Math.min(n,2)+'/2</div>';}
    else if(x==='P'){cls.push('protect');if(ev.viol.has(i))cls.push('hit');h='<div class="ico">'+SVG_NO+'</div><div class="lbl">'+(ev.viol.has(i)?'违规':'禁覆盖')+'</div>';}
    else if(x==='/'||x==='\\'){cls.push('mirror');h='<div class="ico">'+svgMirror(x)+'</div>';}
    if(cur.placed.includes(i)){h+='<div class="dev" style="--dc:'+colorOf(i)+'">'+(S.emitter||'')+(L.range?'<span class="rng">'+L.range+'</span>':'')+'</div>';if(conflictCells.has(i))cls.push('conflict');}
    if(pvTr){if(i===pv)cls.push('pv');else if(pvTr.hits.has(i)&&L.need[i]&&ev.src[i].size<L.need[i])cls.push('pvnew');}
    if(cur.hintCell===i)cls.push('hintcell');if(cur.hintWrong===i)cls.push('hintwrong');
    if(cur.tut&&cur.tut.focus!=null&&cur.tut.focus.includes(i))cls.push('focus');
    el.className=cls.join(' ');el.innerHTML=h;
  }
  $('board').classList.toggle('locked',!!(cur.tut&&cur.tut.lock));
  drawBeams(ev,pvTr?{s:pv,tr:pvTr}:null);
  // HUD
  $('h-dev').textContent=cur.placed.length+'/'+L.raw.kStar;
  $('h-undo').textContent=cur.undoLeft;$('hud-undo').classList.toggle('low',cur.undoLeft<=1);
  $('h-cov').textContent=ev.covered+'/'+ev.total;
  $('btn-undo').disabled=!cur.hist.length||cur.undoLeft<=0||cur.status!=='play';
  $('btn-hint').disabled=cur.status!=='play';
  statusLine();
}
function drawBeams(ev,pv){
  const L=cur.L,svg=$('beams'),bw=$('bw'),cs=bw.clientWidth/L.W;
  const cellEl=$('board').children[0];if(!cellEl)return;
  const step=(bw.clientWidth+3)/L.W; // cell + gap
  const cx=i=>(i%L.W)*step+(step-3)/2,cy=i=>Math.floor(i/L.W)*step+(step-3)/2;
  svg.setAttribute('viewBox','0 0 '+bw.clientWidth+' '+bw.clientHeight);
  let out='';
  const rayPts=(s,ray,upto)=>{const pts=[[cx(s),cy(s)]];for(const j of ray.path){pts.push([cx(j),cy(j)]);if(j===upto)break;}return pts;};
  const line=(pts,st)=>'<polyline points="'+pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ')+'" fill="none" '+st+'/>';
  cur.placed.forEach((s,k)=>{
    const col=COL[k%COL.length];
    for(const ray of trace(L,s).rays){if(!ray.path.length)continue;const pts=rayPts(s,ray);out+=line(pts,'stroke="'+col+'" stroke-width="3" stroke-opacity=".55" stroke-linecap="round" stroke-linejoin="round"');
      if(ray.end==='range'){const [x,y]=pts[pts.length-1],[dr,dc]=ray.dir;const ex=x+dc*step*0.42,ey=y+dr*step*0.42;out+='<path d="M'+(ex-dr*7)+' '+(ey-dc*7)+'L'+(ex+dr*7)+' '+(ey+dc*7)+'" stroke="'+col+'" stroke-width="3" stroke-linecap="round"/>';}}
  });
  ev.pairs.forEach(([a,b])=>{for(const ray of trace(L,a).rays)if(ray.path.includes(b)){out+=line(rayPts(a,ray,b),'stroke="#b4392f" stroke-width="3.5" stroke-dasharray="6 5" stroke-linecap="round"');}});
  if(pv){for(const ray of pv.tr.rays){if(!ray.path.length)continue;out+=line(rayPts(pv.s,ray),'stroke="#223038" stroke-width="2.5" stroke-dasharray="5 4" stroke-linecap="round"');}
    out+='<circle cx="'+cx(pv.s)+'" cy="'+cy(pv.s)+'" r="'+(step*0.22)+'" fill="none" stroke="#223038" stroke-width="2.5" stroke-dasharray="4 3"/>';}
  svg.innerHTML=out;
}
function statusLine(){
  const L=cur.L,ev=cur.ev,T=themeOf(),st=$('status');
  if(cur.msg){st.className='status '+(cur.msgCls||'info');st.innerHTML=cur.msg;return;}
  const parts=[];let cls='';
  if(ev.viol.size){cls='bad';parts.push('C1 违规：'+[...ev.viol].map(i=>coordOf(i,L.W)).join('、')+' 被照到了');}
  if(ev.pairs.length){cls='bad';const seen=new Set(),ps=[];ev.pairs.forEach(([a,b])=>{const k=Math.min(a,b)+'-'+Math.max(a,b);if(!seen.has(k)){seen.add(k);ps.push(coordOf(a,L.W)+' 与 '+coordOf(b,L.W));}});parts.push('G1 互照：'+ps.join('；'));}
  ev.doubles.forEach(d=>{if(d.n<2&&cur.placed.length)parts.push('双照格 '+coordOf(d.t,L.W)+' '+Math.min(d.n,2)+'/2');});
  if(!parts.length){
    if(!cur.placed.length)parts.push('按住任意格子预览覆盖范围，点一下放置。');
    else if(cur.placed.length>=L.raw.kStar&&!ev.won)parts.push('设备已用完但还有 '+(ev.total-ev.covered)+' 格没完成：需要收回调整（剩余撤回 '+cur.undoLeft+' 次）。');
    else parts.push('还差 '+(ev.total-ev.covered)+' 格；剩余设备 '+(L.raw.kStar-cur.placed.length)+' 台。');
  }else if(cur.placed.length>=L.raw.kStar)parts.push('需要收回调整（剩余撤回 '+cur.undoLeft+' 次）');
  st.className='status '+cls;st.innerHTML=parts.join('；');
}
function flash(msg,cls){cur.msg=msg;cur.msgCls=cls;statusLine();clearTimeout(cur.msgT);cur.msgT=setTimeout(()=>{if(cur){cur.msg=null;statusLine();}},2600);}

/* ───────── 操作 ───────── */
function cellRule(i){
  const L=cur.L,x=L.cells[i],T=themeOf();
  return {'#':T.block+'：挡住光线。','N':'C3 '+(short(T.C3)||'不可放置格')+'：不能放设备，但它本身要被照到。','D':'C2 '+(short(T.C2)||'双照格')+'：需要两台不同设备照到（同一台的多条光只算 1 台）。','P':'C1 '+(short(T.C1)||'禁覆盖格')+'：不能被任何光照到；光会穿过它。','/':'R1 '+(short(T.R1)||'反射格')+'：光线碰到会转 90°，不能放设备。','\\':'R1 '+(short(T.R1)||'反射格')+'：光线碰到会转 90°，不能放设备。'}[x]||'';
}
function tap(i){
  if(cur.status!=='play')return;
  const L=cur.L,x=L.cells[i];
  if(cur.tut&&cur.tut.lock){if(!cur.tut.focus||!cur.tut.focus.includes(i)||cur.tut.action!=='tap')return;}
  cur.hintCell=null;cur.hintWrong=null;
  if(cur.placed.includes(i)){
    if(cur.tut&&cur.tut.free===false)return;
    if(cur.undoLeft<=0){flash('撤回次数已用完，不能再收回设备。','bad');return;}
    cur.placed=cur.placed.filter(p=>p!==i);cur.hist.push({t:'remove',c:i});spendUndo();
    render();afterMove();return;
  }
  if(x!=='.'){flash(cellRule(i)||'这里不能放设备。','info');return;}
  if(cur.placed.length>=L.raw.kStar){flash('设备已用完：先点一台已放的设备收回（消耗 1 次撤回）。','bad');return;}
  cur.placed.push(i);cur.hist.push({t:'place',c:i});cur.places++;
  render();afterMove();
  if(cur.tut)tutAfterTap(i);
}
function spendUndo(){if(cur.tut)return;cur.undoLeft--;cur.undoUsed++;}
function undo(){
  if(cur.status!=='play'||!cur.hist.length||cur.undoLeft<=0)return;
  const h=cur.hist.pop();
  if(h.t==='place')cur.placed=cur.placed.filter(p=>p!==h.c);else cur.placed.push(h.c);
  spendUndo();cur.hintCell=null;cur.hintWrong=null;render();afterMove();
}
function afterMove(){
  const L=cur.L,ev=cur.ev;
  if(ev.won){finish(true);return;}
  if(cur.placed.length>=L.raw.kStar&&cur.undoLeft<=0&&!cur.tut){finish(false,'撤回次数用完，设备也已摆满，无法再调整。');}
}
function finish(win,reason){
  cur.status=win?'won':'failed';
  const sec=Math.round((Date.now()-cur.t0)/1000);
  if(win){cleared[cur.i]=true;if(!isFree(cur.i)){stamina=Math.min(CFG.max,stamina+CFG.refund);tickStamina();}}
  const rec={id:cur.L.raw.id,tier:cur.L.raw.tier,result:win?'通关':'失败',sec,places:cur.places,undoUsed:cur.undoUsed,hints:cur.hints,rating:null};
  records.push(rec);cur.rec=rec;render();
  setTimeout(()=>resultDialog(win,reason),win?380:120);
}

/* ───────── 结果弹窗 ───────── */
function chainHTML(raw){
  return '<ol class="chain">'+raw.steps.map(s=>{const [n,c]=STEPNAME[s.tier];const why=s.tier==='G'?(s.cands+' 选 1，猜错最多耗 '+s.worstCost+' 次撤回'):s.why.join('；').replace('路口推理：','');return '<li><span class="tg '+c+'">'+n+'</span>先看 '+LC(s.target)+' → 放 <b>'+s.place.map(LC).join('、')+'</b><br><span style="color:var(--muted)">'+why+'</span></li>';}).join('')+'</ol>';
}
function metricsHTML(raw){
  const m=raw.metrics,c=m.count,parts=Object.entries(c).filter(([k,v])=>v).map(([k,v])=>STEPNAME[k][0]+'×'+v).join('、');
  return '<table><tr><th>档位</th><td>'+raw.tier+'</td><th>开局</th><td>'+STEPNAME[m.opening][0]+'</td></tr><tr><th>推理步</th><td colspan="3">'+parts+'</td></tr><tr><th>需尝试</th><td>'+m.guesses+' 次</td><th>最坏试错</th><td>'+m.worstTrial+' 次撤回</td></tr></table>';
}
function rateRow(){return '<p style="margin-top:10px"><b>你的感受：</b></p><div class="row" id="rate">'+['太简单','刚好','有点难','太难'].map(r=>'<button data-rate="'+r+'">'+r+'</button>').join('')+'</div>';}
function resultDialog(win,reason){
  const raw=cur.L.raw,T=themeOf(),r=cur.rec;
  let h='<h2>'+(win?T.finish:'未能完成')+'</h2>';
  h+='<p>'+(win?'用时 <b class="num">'+r.sec+'s</b>，放置 '+r.places+' 次，撤回 '+r.undoUsed+' 次，提示 '+r.hints+' 次。'+(isFree(cur.i)?'':'体力返还 '+CFG.refund+'。'):(reason||'')+' 本局体力不返还。')+'</p>';
  h+=rateRow();
  if(win){h+='<p style="margin-top:12px"><b>参考推理链</b>（生成器按人的推理方式求解）</p>'+chainHTML(raw)+metricsHTML(raw);}
  else h+='<details style="margin-top:10px"><summary style="font-size:13px;cursor:pointer">查看推理链（会剧透）</summary>'+chainHTML(raw)+metricsHTML(raw)+'</details>';
  const next=cur.i+1<LV.length;
  h+='<div class="row">'+(win&&next?'<button class="pri" data-act="next">下一关</button>':'')+'<button '+(win?'':'class="pri"')+' data-act="restart">'+(win?'再玩':'重开')+(isFree(cur.i)?'':' -'+CFG.cost+'体力')+'</button><button data-act="menu">选关</button></div>';
  openDlg(h);
  $('dlgbody').querySelectorAll('[data-rate]').forEach(b=>b.onclick=()=>{r.rating=b.dataset.rate;$('dlgbody').querySelectorAll('[data-rate]').forEach(x=>x.classList.toggle('on',x===b));});
  $('dlgbody').querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>{const a=b.dataset.act,i=cur.i;closeDlg();if(a==='next')startLevel(i+1);else if(a==='restart')startLevel(i,true);else showMenu();});
}
function openDlg(h){$('dlgbody').innerHTML=h;if(!$('dlg').open)$('dlg').showModal();}
function closeDlg(){if($('dlg').open)$('dlg').close();}
function openNoStamina(i){
  tickStamina();const s=regenAt?Math.ceil((regenAt-Date.now())/1000):0;
  openDlg('<h2>体力不足</h2><p>开局需要 '+CFG.cost+' 体力，当前 '+stamina+'。每 '+Math.round(CFG.regenSec/60*10)/10+' 分钟恢复 1 点，下一点约 '+s+' 秒后。</p><p class="tip">体验用：可在“后台”里直接回满。</p><div class="row"><button class="pri" data-x="fill">回满体力（调试）</button><button data-x="close">返回</button></div>');
  $('dlgbody').querySelector('[data-x=fill]').onclick=()=>{stamina=CFG.max;regenAt=null;tickStamina();closeDlg();startLevel(i);};
  $('dlgbody').querySelector('[data-x=close]').onclick=closeDlg;
}

/* ───────── 提示 ───────── */
function hint(){
  if(cur.status!=='play')return;
  const L=cur.L,raw=L.raw,ans=new Set(raw.answer.map(a=>a.cell));
  cur.hints++;cur.hintCell=null;cur.hintWrong=null;
  const wrong=cur.placed.filter(p=>!ans.has(p));
  if(wrong.length){
    if(cur.hintStage===0){cur.hintStage=1;flash('当前布局里有设备不在正确位置上：这样摆无法完成。','bad');}
    else{cur.hintWrong=wrong[0];cur.hintStage=0;flash('红框这台放错了：'+coordOf(wrong[0],L.W)+'。','bad');}
    render();return;
  }
  const idx=s=>{const m=/([A-F])(\d)/.exec(s);return (Number(m[2])-1)*L.W+(m[1].charCodeAt(0)-65);};
  const step=raw.steps.find(s=>s.place.some(p=>!cur.placed.includes(idx(p))));
  if(!step){flash('全部设备都已就位。','ok');return;}
  const [n]=STEPNAME[step.tier];
  if(cur.hintStage===0){cur.hintStage=1;cur.hintCell=idx(step.target);flash('提示 1：先看金框这格（'+LC(step.target)+'）——哪些位置能照到它？思路类型：'+n+'。','info');}
  else{cur.hintStage=0;const p=step.place.map(idx).find(c=>!cur.placed.includes(c));cur.hintCell=p;flash('提示 2：放在 '+coordOf(p,L.W)+'。'+(step.tier==='G'?'这一步需要尝试。':step.why.join('；').replace('路口推理：','')),'info');}
  render();
}

/* ───────── 新手指引（第 1 关） ───────── */
function startTutorial(){
  const L=cur.L,c=i=>coordOf(i,L.W),T=themeOf();
  cur.tut={k:0,lock:true,free:false,steps:[
    {text:'<b>目标</b>：用 2 台'+T.device+T.verb+'全部'+T.target+'。'+T.device+'会照亮自己所在格，并向上下左右发光，遇到'+T.block+'就停。指引期间不消耗撤回。',focus:null,action:'next'},
    {text:'先找<b>最难照到的格子</b>。看 '+c(0)+'：它下面是'+T.block+'，只有第一行的'+T.device+'能照到它。',focus:[0,1,2,3],action:'next'},
    {text:'第一行有 4 个位置可选。<b>按住 '+c(2)+' 不松手</b>，预览它能照到哪里。',focus:[2],action:'press'},
    {text:'它照亮了整个第一行，还能顺着 C 列一路照到底，比第一行其他位置照得都多。<b>松手后点一下 '+c(2)+'</b> 放下'+T.device+'。',focus:[2],action:'tap'},
    {text:'还剩 3 格没亮。哪个位置能一次全部照到？<b>自己试试</b>，可以先按住预览。<br>正式关卡里：收回设备和撤销都消耗撤回次数，每关只有 '+CFG.undo+' 次。',focus:null,action:'free'},
  ]};
  showTut();
}
function showTut(){
  const t=cur.tut;if(!t)return;const s=t.steps[t.k];
  t.focus=s.focus;t.action=s.action;t.lock=s.action!=='free';t.free=s.action==='free';
  $('coachtext').innerHTML=s.text;$('coachnext').classList.toggle('hidden',s.action!=='next');$('coachnext').textContent='下一步';
  if(s.action==='free'){$('coachnext').classList.remove('hidden');$('coachnext').textContent='知道了';}
  const box=$('coachbox');box.classList.add('on');
  render();
  const bw=$('bw').getBoundingClientRect(),app=$('app').getBoundingClientRect();
  const cardEl=$('game').querySelector('.card').getBoundingClientRect();box.style.top=(cardEl.bottom-app.top+8)+'px';
}
function tutNext(){const t=cur.tut;if(!t)return;if(t.k>=t.steps.length-1){endTut();return;}t.k++;showTut();}
function endTut(){if(!cur||!cur.tut)return;cur.tut=null;$('coachbox').classList.remove('on');render();}
function tutAfterTap(i){const t=cur.tut;if(!t)return;const s=t.steps[t.k];if(s.action==='tap'&&s.focus.includes(i))tutNext();else if(s.action==='free'&&cur.ev.won)endTut();}
$('coachnext').onclick=tutNext;$('coachskip').onclick=endTut;

/* ───────── 长按预览 ───────── */
let press=null;
$('board').addEventListener('pointerdown',e=>{
  const el=e.target.closest('[data-cell]');if(!el||!cur||cur.status!=='play')return;
  const i=Number(el.dataset.cell);
  if(cur.tut&&cur.tut.lock&&!(cur.tut.focus&&cur.tut.focus.includes(i)))return;
  e.preventDefault();
  press={i,shown:false,id:e.pointerId,timer:setTimeout(()=>{press.shown=true;showPreview(i);},300)};
});
function endPress(e,fire){
  if(!press)return;clearTimeout(press.timer);const p=press;press=null;
  if(p.shown){cur.pv=null;cur.msg=null;render();if(cur.tut&&cur.tut.steps[cur.tut.k].action==='press'&&p.i===cur.tut.focus[0])tutNext();return;}
  if(fire)tap(p.i);
}
$('board').addEventListener('pointerup',e=>endPress(e,true));
$('board').addEventListener('pointercancel',e=>endPress(e,false));
$('board').addEventListener('pointerleave',e=>endPress(e,false));
$('board').addEventListener('contextmenu',e=>e.preventDefault());
function showPreview(i){
  const L=cur.L,x=L.cells[i];
  if(cur.placed.includes(i)){cur.pv=null;cur.msg='这台已放下（彩色实线是它的覆盖范围）。点一下会收回，消耗 1 次撤回。';cur.msgCls='info';render();return;}
  if(x!=='.'){cur.pv=null;cur.msg=cellRule(i);cur.msgCls='info';render();return;}
  cur.pv=i;render();
  const tr=trace(L,i),ev=cur.ev;let add=0;tr.hits.forEach(h=>{if(L.need[h]&&ev.src[h].size<L.need[h])add++;});
  const warn=[];[...tr.hits].filter(h=>L.cells[h]==='P').forEach(h=>warn.push('会照到禁覆盖格 '+coordOf(h,L.W)));
  if(L.g1){cur.placed.forEach(p=>{if(tr.hits.has(p))warn.push('会照到已放的 '+coordOf(p,L.W));if(trace(L,p).hits.has(i))warn.push('位于 '+coordOf(p,L.W)+' 的光里');});}
  cur.msg='预览 '+coordOf(i,L.W)+'：新增覆盖 '+add+' 格'+(warn.length?'；<b style="color:var(--bad)">'+warn.join('；')+'</b>':'')+'。松手取消。';cur.msgCls=warn.length?'bad':'info';statusLine();
}

/* ───────── 选关 / 记录 / 后台 ───────── */
function showMenu(){
  cur=null;$('coachbox').classList.remove('on');$('app').dataset.theme='stage';
  $('game').classList.add('hidden');$('menu').classList.remove('hidden');
  $('levels').innerHTML=LV.map((l,i)=>{const T=TH[l.theme];return '<button class="lvbtn" data-lv="'+i+'"><span class="r1">S'+String(l.id).padStart(2,'0')+' '+T.name+(cleared[i]?'<span class="done">✓</span>':'')+'</span><span class="r2">'+(CFG.showTier?'<span class="tier '+TIERCLS[l.tier]+'">'+l.tier+'</span> ':'')+(l.mech.join(' + ')||'基础')+' · '+l.w+'×'+l.h+' · '+l.kStar+' 台 '+(isFree(i)?'<span class="free">免体力</span>':'')+'</span></button>';}).join('');
  $('levels').querySelectorAll('[data-lv]').forEach(b=>b.onclick=()=>startLevel(Number(b.dataset.lv)));
  tickStamina();
}
function leaveGuard(fn){
  if(cur&&cur.status==='play'&&(cur.placed.length||cur.hist.length)){
    openDlg('<h2>放弃本局？</h2><p>离开会记为失败，'+(isFree(cur.i)?'':'已扣的 '+CFG.cost+' 体力不返还。')+'</p><div class="row"><button class="pri" data-x="y">放弃</button><button data-x="n">继续玩</button></div>');
    $('dlgbody').querySelector('[data-x=y]').onclick=()=>{closeDlg();records.push({id:cur.L.raw.id,tier:cur.L.raw.tier,result:'放弃',sec:Math.round((Date.now()-cur.t0)/1000),places:cur.places,undoUsed:cur.undoUsed,hints:cur.hints,rating:null});fn();};
    $('dlgbody').querySelector('[data-x=n]').onclick=closeDlg;
  }else fn();
}
$('btn-levels').onclick=()=>leaveGuard(showMenu);
$('btn-undo').onclick=undo;$('btn-hint').onclick=hint;
$('btn-restart').onclick=()=>{if(!cur)return;const i=cur.i;leaveGuard(()=>startLevel(i,true));};
$('btn-quit').onclick=()=>{if(!cur||cur.status!=='play')return;finish(false,'你主动放弃了本局。');};
$('btn-log').onclick=()=>{
  const lines=['样本\t档位\t结果\t用时s\t放置\t撤回\t提示\t评价'].concat(records.map(r=>['S'+String(r.id).padStart(2,'0'),r.tier,r.result,r.sec,r.places,r.undoUsed,r.hints,r.rating||'-'].join('\t')));
  const rows=records.map(r=>'<tr><td>S'+String(r.id).padStart(2,'0')+'</td><td>'+r.tier+'</td><td>'+r.result+'</td><td class="num">'+r.sec+'</td><td class="num">'+r.places+'</td><td class="num">'+r.undoUsed+'</td><td class="num">'+r.hints+'</td><td>'+(r.rating||'—')+'</td></tr>').join('');
  openDlg('<h2>体验记录</h2><p class="tip">刷新页面会清空。复制后直接发回即可。</p><table><tr><th>样本</th><th>档位</th><th>结果</th><th>用时</th><th>放置</th><th>撤回</th><th>提示</th><th>评价</th></tr>'+(rows||'<tr><td colspan="8">还没有记录</td></tr>')+'</table><textarea id="logtxt" readonly>'+lines.join('\n')+'</textarea><div class="row"><button class="pri" id="cp">复制</button><button id="cl">关闭</button></div>');
  $('cp').onclick=()=>{const t=$('logtxt');t.select();let ok=false;try{ok=document.execCommand('copy');}catch(e){}if(navigator.clipboard)navigator.clipboard.writeText(t.value).then(()=>{$('cp').textContent='已复制';},()=>{$('cp').textContent=ok?'已复制':'请手动复制';});else $('cp').textContent=ok?'已复制':'请手动复制';};
  $('cl').onclick=closeDlg;
};
$('btn-admin').onclick=()=>{
  const f=[['undo','每关撤回次数'],['max','体力上限'],['cost','开局消耗'],['regenSec','恢复 1 点所需秒数'],['refund','通关返还'],['freeLevels','前 N 关免体力']];
  openDlg('<h2>后台参数（体验用）</h2><p class="tip">修改后对下一局生效。正式口径：撤回 5、体力 50 / 开局 10 / 3 分钟回 1 / 通关返还 10、第 1–10 关免体力；本样本只有 10 关，默认只让第 1 关免体力，方便体验体力消耗。</p><div class="form">'+f.map(([k,n])=>'<label for="cfg-'+k+'">'+n+'</label><input id="cfg-'+k+'" type="number" min="0" value="'+CFG[k]+'">').join('')+'<label for="cfg-st">当前体力</label><input id="cfg-st" type="number" min="0" value="'+stamina+'"><label for="cfg-tier">显示档位</label><input id="cfg-tier" type="checkbox" style="height:20px;width:20px" '+(CFG.showTier?'checked':'')+'></div><div class="row"><button class="pri" id="sv">保存</button><button id="fill">回满体力</button><button id="cx">关闭</button></div>');
  $('sv').onclick=()=>{f.forEach(([k])=>{const v=Number($('cfg-'+k).value);if(Number.isFinite(v)&&v>=0)CFG[k]=Math.round(v);});CFG.regenSec=Math.max(1,CFG.regenSec);CFG.max=Math.max(1,CFG.max);stamina=Math.min(CFG.max,Math.max(0,Math.round(Number($('cfg-st').value)||0)));regenAt=null;CFG.showTier=$('cfg-tier').checked;tickStamina();closeDlg();if(!cur)showMenu();else $('lvtier').classList.toggle('hidden',!CFG.showTier);};
  $('fill').onclick=()=>{stamina=CFG.max;regenAt=null;tickStamina();$('cfg-st').value=stamina;};
  $('cx').onclick=closeDlg;
};
window.addEventListener('resize',()=>{if(cur)setupLevel();});
$('dlg').addEventListener('cancel',e=>{if(cur&&cur.status!=='play'){e.preventDefault();}});

/* ───────── 自检：每关参考解必须通关，且不能用更少设备 ───────── */
window.FillItUp={
  selfTest(){const res=LV.map(raw=>{const L=prep(raw);const ans=raw.answer.map(a=>a.cell);return {id:raw.id,won:evalBoard(L,ans).won,count:ans.length===raw.kStar};});return {pass:res.every(r=>r.won&&r.count),res};},
  state:()=>cur&&{i:cur.i,placed:cur.placed.slice(),undoLeft:cur.undoLeft,undoUsed:cur.undoUsed,status:cur.status,won:cur.ev&&cur.ev.won,covered:cur.ev&&cur.ev.covered,total:cur.ev&&cur.ev.total,tut:cur.tut?cur.tut.k:null,pv:cur.pv},
  stamina:()=>({stamina,cfg:Object.assign({},CFG)}),records:()=>records.slice(),levels:LV,
};
const st0=window.FillItUp.selfTest();if(!st0.pass)console.error('自检失败',st0);
showMenu();
</script>
